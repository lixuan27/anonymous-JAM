[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jam-review"
version = "0.1.0"
description = "Joint action and world pretraining"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["torch>=2.5,<3", "diffusers>=0.39,<0.41", "transformers>=4.51,<6", "safetensors>=0.5", "accelerate>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
